{% extends "base.html" %}

{% block content %}
<div class="job-form">
    <h1>Post a New Job</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Publish Job</button>
    </form>

    <p><a href="{% url 'recruiter_dashboard' %}">Back to Dashboard</a></p>
</div>
{% endblock %}
